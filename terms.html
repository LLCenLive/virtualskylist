<div class="modal-overlay" id="auth-modal">
  <div class="modal-box">
    <button type="button" class="modal-close" id="auth-close-btn" aria-label="Close">
      <svg class="icon"><use href="#i-x"/></svg>
    </button>
    <h2 id="auth-modal-title" data-i18n="auth.title.signin">Se connecter</h2>
    <form id="auth-form">
      <label class="field-label" for="auth-email" data-i18n="auth.email.label">Email</label>
      <input class="field" type="email" id="auth-email" required autocomplete="email">
      <label class="field-label" for="auth-password" data-i18n="auth.password.label">Mot de passe</label>
      <input class="field" type="password" id="auth-password" required minlength="6" autocomplete="current-password">
      <p class="auth-error" id="auth-error" style="display:none"></p>
      <p class="auth-note" id="auth-note" style="display:none"></p>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn" data-i18n="auth.submit.signin">Se connecter</button>
    </form>
    <button type="button" class="auth-switch-link" id="auth-toggle-mode" data-i18n="auth.switch.toSignup">Pas encore de compte ? Crée-en un</button>
  </div>
</div>
